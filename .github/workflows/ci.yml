name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-and-repro:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest suite
        run: pytest

      - name: Generate starter dataset and validate with DuckDB
        run: |
          python -m oryva_planning generate --scale starter --seed 20261022 --output-dir data
          python -m oryva_planning validate --data-dir data

      - name: Run reproducibility proof
        run: python -m oryva_planning repro --scale starter --seed 20261022
